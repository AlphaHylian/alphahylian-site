<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · AlphaHylian</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="description" content="Page not found.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>
  try {
    var t = localStorage.getItem('ah-theme');
    if (t && ['stars','terminal','minecraft','synthwave','paper'].indexOf(t) !== -1) {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
</script>
<style>
  .nf-wrap{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    gap: 18px;
  }
  .nf-code{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(84px, 22vw, 190px);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--text);
    text-shadow: 0 0 46px rgba(138,108,242,0.35);
  }
  .nf-msg{
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-dim);
    max-width: 34ch;
    line-height: 1.6;
  }
  .nf-home{
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 12px 22px;
    border-radius: var(--panel-radius);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .nf-home:hover{
    border-color: var(--accent);
    background: linear-gradient(135deg, var(--accent-deep), var(--panel-alt));
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div class="nf-wrap">
  <div class="nf-code">404</div>
  <p class="nf-msg">This page pulled a classic AlphaHylian and shipped nothing. It isn't here.</p>
  <a class="nf-home" href="/">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 8 12l7 7"/></svg>
    Back to homepage
  </a>
</div>

<script>
  /* Tiny self-contained starfield — no dependency on script.js. */
  (function(){
    var c = document.getElementById('bg-canvas');
    var x = c.getContext('2d');
    var w, h, stars = [];
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function resize(){
      w = c.width = window.innerWidth;
      h = c.height = window.innerHeight;
      var n = Math.min(220, Math.floor(w * h / 9000));
      stars = Array.from({ length: n }, function(){
        return {
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.18, vy: (Math.random() - 0.5) * 0.18,
          s: Math.random() < 0.8 ? 2 : 3,
          p: Math.random() * Math.PI * 2, tw: 0.0008 + Math.random() * 0.0016
        };
      });
    }
    resize();
    window.addEventListener('resize', resize);
    function draw(t){
      x.clearRect(0, 0, w, h);
      for(var i = 0; i < stars.length; i++){
        var p = stars[i];
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0) p.x += w; else if(p.x > w) p.x -= w;
        if(p.y < 0) p.y += h; else if(p.y > h) p.y -= h;
        var a = 0.35 + 0.45 * Math.sin(p.p + t * p.tw);
        x.fillStyle = 'rgba(150,120,255,' + Math.max(0, a).toFixed(3) + ')';
        x.fillRect(p.x, p.y, p.s, p.s);
      }
      for(var a2 = 0; a2 < stars.length; a2++){
        for(var b = a2 + 1; b < stars.length; b++){
          var s1 = stars[a2], s2 = stars[b];
          var dx = s1.x - s2.x, dy = s1.y - s2.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if(d < 120){
            x.strokeStyle = 'rgba(150,120,255,' + (0.3 * (1 - d / 120)).toFixed(3) + ')';
            x.lineWidth = 1;
            x.beginPath(); x.moveTo(s1.x, s1.y); x.lineTo(s2.x, s2.y); x.stroke();
          }
        }
      }
      if(!reduce) requestAnimationFrame(draw);
    }
    if(reduce) draw(0); else requestAnimationFrame(draw);
  })();
</script>

</body>
</html>
