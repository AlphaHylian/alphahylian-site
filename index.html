<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Bose</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .profile {
            margin-bottom: 40px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #333;
            margin: 0 auto 20px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #000;
        }
        
        .bio {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .link {
            display: block;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            text-decoration: none;
            color: #000;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .link:hover {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar"></div>
            <h1>Ayan Bose</h1>
            <p class="bio">Developer & Minecraft modding enthusiast</p>
        </div>
        
        <div class="links">
            <a href="#" class="link">GitHub</a>
            <a href="#" class="link">Twitter / X</a>
            <a href="#" class="link">Discord</a>
            <a href="#" class="link">Email</a>
            <a href="#" class="link">Your Link Here</a>
        </div>
        
        <div class="footer">
            <p>Made with simplicity in mind</p>
        </div>
    </div>
</body>
</html>
